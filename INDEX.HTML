<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Holy Quran</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f7f5;
    color:#17231c;
}

header{
    background:#0b4029;
    color:white;
    padding:20px;
    text-align:center;
}

header h1{
    margin:0;
}

.container{
    width:90%;
    max-width:1100px;
    margin:30px auto;
}

.controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:25px;
}

input,select,button{
    padding:12px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:16px;
}

input{
    flex:1;
    min-width:220px;
}

button{
    background:#12603d;
    color:white;
    border:0;
    cursor:pointer;
}

button:hover{
    background:#0b4029;
}

#surahList{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

.surah{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
    cursor:pointer;
}

.surah:hover{
    transform:translateY(-2px);
}

.surah h2{
    margin-top:0;
    color:#12603d;
}

.arabic{
    direction:rtl;
    text-align:right;
    font-family:"Times New Roman",serif;
}

.surahArabic{
    font-size:28px;
}

#reader{
    display:none;
}

.readerTop{
    text-align:center;
    background:white;
    padding:25px;
    border-radius:12px;
    margin-bottom:20px;
}

.ayah{
    background:white;
    padding:25px;
    margin-bottom:15px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.ayahArabic{
    font-size:34px;
    line-height:2.2;
}

.translation{
    margin-top:15px;
    color:#666;
    line-height:1.7;
}

.loading{
    text-align:center;
    padding:40px;
}

.hidden{
    display:none;
}

@media(max-width:600px){

    .container{
        width:94%;
    }

    .ayahArabic{
        font-size:27px;
    }

}
</style>
</head>

<body>

<header>
    <h1>📖 Holy Quran</h1>
    <p>Read the Quran — 114 Surahs</p>
</header>


<div class="container">


<!-- SURAH LIST -->

<section id="surahPage">

    <div class="controls">

        <input
            id="search"
            type="text"
            placeholder="Search Surah..."
            oninput="searchSurah()"
        >

        <select id="surahSelect" onchange="openSurah(this.value)">
            <option value="">Select Surah</option>
        </select>

    </div>

    <div id="surahList">
        <div class="loading">
            Loading Quran...
        </div>
    </div>

</section>


<!-- QURAN READER -->

<section id="reader">

    <button onclick="backToSurahs()">
        ← Back to Surahs
    </button>

    <div id="readerContent"></div>

</section>


</div>


<script>

/* =========================================
   HOLY QURAN
   ========================================= */

let surahs = [];


/* =========================================
   LOAD ALL 114 SURAHS
   ========================================= */

async function loadQuran(){

    const list =
        document.getElementById("surahList");

    try{

        const response =
            await fetch(
                "https://api.alquran.cloud/v1/surah"
            );

        if(!response.ok){
            throw new Error("Quran failed to load");
        }

        const data =
            await response.json();

        surahs = data.data;

        showSurahs(surahs);

        fillDropdown();

    }catch(error){

        list.innerHTML = `
            <div class="loading">
                <h2>Unable to load Quran</h2>

                <p>
                    Please connect to the internet
                    and try again.
                </p>

                <button onclick="loadQuran()">
                    Try Again
                </button>
            </div>
        `;

    }

}


/* =========================================
   SHOW SURAH LIST
   ========================================= */

function showSurahs(list){

    const container =
        document.getElementById("surahList");

    container.innerHTML = "";

    list.forEach(surah => {

        container.innerHTML += `

            <div
                class="surah"
                onclick="openSurah(${surah.number})"
            >

                <h2>
                    ${surah.number}.
                    ${surah.englishName}
                </h2>

                <div class="arabic surahArabic">
                    ${surah.name}
                </div>

                <p>
                    ${surah.englishNameTranslation}
                </p>

                <p>
                    ${surah.revelationType}
                    •
                    ${surah.numberOfAyahs} Ayahs
                </p>

            </div>

        `;

    });

}


/* =========================================
   DROPDOWN
   ========================================= */

function fillDropdown(){

    const select =
        document.getElementById("surahSelect");

    select.innerHTML =
        `<option value="">Select Surah</option>`;

    surahs.forEach(surah => {

        select.innerHTML += `

            <option value="${surah.number}">
                ${surah.number}.
                ${surah.englishName}
            </option>

        `;

    });

}


/* =========================================
   SEARCH SURAH
   ========================================= */

function searchSurah(){

    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();

    if(!search){

        showSurahs(surahs);

        return;

    }

    const results =
        surahs.filter(surah =>

            surah.englishName
            .toLowerCase()
            .includes(search)

            ||

            surah.name
            .includes(search)

            ||

            surah.englishNameTranslation
            .toLowerCase()
            .includes(search)

        );

    showSurahs(results);

}


/* =========================================
   OPEN SURAH
   ========================================= */

async function openSurah(number){

    if(!number){
        return;
    }

    document
        .getElementById("surahPage")
        .style.display="none";

    document
        .getElementById("reader")
        .style.display="block";

    const reader =
        document.getElementById(
            "readerContent"
        );

    reader.innerHTML = `
        <div class="loading">
            <h2>📖 Loading Surah...</h2>
            <p>Please wait...</p>
        </div>
    `;

    window.scrollTo(0,0);

    try{

        const arabicResponse =
            await fetch(
                "https://api.alquran.cloud/v1/surah/"
                + number
                + "/quran-uthmani"
            );

        const englishResponse =
            await fetch(
                "https://api.alquran.cloud/v1/surah/"
                + number
                + "/en.sahih"
            );

        if(
            !arabicResponse.ok ||
            !englishResponse.ok
        ){

            throw new Error("Surah failed");

        }

        const arabicData =
            await arabicResponse.json();

        const englishData =
            await englishResponse.json();

        const arabic =
            arabicData.data;

        const english =
            englishData.data;


        let html = `

            <div class="readerTop">

                <h1>
                    Surah ${arabic.number}
                    -
                    ${arabic.englishName}
                </h1>

                <h2 class="arabic">
                    ${arabic.name}
                </h2>

                <p>
                    ${arabic.englishNameTranslation}
                    •
                    ${arabic.revelationType}
                    •
                    ${arabic.numberOfAyahs} Ayahs
                </p>

            </div>

        `;


        arabic.ayahs.forEach(
            (ayah,index) => {

                const translation =
                    english.ayahs[index]
                    ? english.ayahs[index].text
                    : "";

                html += `

                    <div class="ayah">

                        <div class="arabic ayahArabic">

                            ${ayah.text}

                            <span>
                                ۝ ${ayah.numberInSurah}
                            </span>

                        </div>

                        <div class="translation">

                            ${translation}

                        </div>

                    </div>

                `;

            }
        );


        reader.innerHTML = html;

    }catch(error){

        console.error(error);

        reader.innerHTML = `

            <div class="loading">

                <h2>
                    ❌ Quran could not be loaded
                </h2>

                <p>
                    Please check your internet connection.
                </p>

                <button
                    onclick="openSurah(${number})"
                >
                    Try Again
                </button>

            </div>

        `;

    }

}


/* =========================================
   BACK TO SURAHS
   ========================================= */

function backToSurahs(){

    document
        .getElementById("reader")
        .style.display="none";

    document
        .getElementById("surahPage")
        .style.display="block";

    window.scrollTo(0,0);

}


/* =========================================
   START
   ========================================= */

loadQuran();

</script>

</body>
</html>
